# Résolveur du hub (chantier B — routage par noms)
# Autoritaire sur <hub_dns_zone> : hub.zone est généré par hub-api dans
# /etc/dnsmasq.d-generated (volume DÉDIÉ — ne jamais mélanger statique et
# généré : la publication purge le dossier généré) ; tout le reste est
# forwardé au résolveur hôte (/etc/resolv.conf du conteneur).
port=53
no-hosts
resolv-file=/etc/resolv.conf
addn-hosts=/etc/dnsmasq.d-generated/hub.hosts
# systemd-resolved écoute 127.0.0.53/54 — on exclut le loopback ; bind-dynamic
# gère le hot-plug (wg0 apparaît après le boot du conteneur, reboot WG...)
except-interface=lo
bind-dynamic
# n'accepte que les réseaux direct-attachés (LAN + tunnel WG) — pas un
# résolveur ouvert vers Internet (review I4)
local-service
