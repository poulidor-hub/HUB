# =============================================================================
# PhiliaNG transparent proxy (SNI: proxy.example.lan)
# =============================================================================
# Ce fichier est inclus conditionnellement par docker-entrypoint.sh
# uniquement si les certificats PhiliaNG existent dans /etc/nginx/ssl/server/philia-ng/

# Port 80 — Redirection HTTP → HTTPS
server {
    listen 80;
    server_name proxy.example.lan;
    return 301 https://$host$request_uri;
}

# Port 443 — Proxy transparent vers le conteneur Philia (port 4443)
server {
    listen 443 ssl;
    server_name proxy.example.lan;

    # Certificat dédié CN=proxy.example.lan (auto-signé)
    ssl_certificate     /etc/nginx/ssl/server/philia-ng/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server/philia-ng/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 1G;

    location / {
        # host.docker.internal pointe vers l'IP de l'hôte Docker, quel que soit
        # le serveur. Philia Proxy expose son HTTPS sur le port 4443 de l'hôte.
        # Cela rend le déploiement automatique : pas d'IP à coder en dur.
        proxy_pass https://host.docker.internal:4443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Le conteneur Philia utilise un cert auto-signé
        proxy_ssl_verify off;

        # Support SSE et long-polling
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
