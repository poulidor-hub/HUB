# =============================================================================
# Headers de sécurité — snippet factorisé
# =============================================================================
# Règle nginx : une location qui définit le moindre add_header perd TOUTES les
# directives add_header héritées du bloc server. Ce snippet est donc inclus au
# niveau du server ET dans chaque location qui redéfinit add_header (les
# locations de cache Cache-Control...), afin que les headers de sécurité
# partent sur TOUTES les réponses.
# NB : ce fichier vit dans /etc/nginx/templates/ — jamais dans conf.d/ sous un
# nom *.conf, sinon il serait auto-inclus au niveau http.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP - Content Security Policy
# Protège contre les injections XSS même en réseau local
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
