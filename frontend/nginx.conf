# =============================================================================
# Configuration Nginx avec support HTTPS
# =============================================================================
# Cette configuration supporte HTTP et HTTPS selon la présence des certificats
# 
# Mode HTTP uniquement (pas de certificats):
#   - Port 80 uniquement
#
# Mode HTTPS (certificats dans /etc/nginx/ssl/):
#   - Port 80 : Redirection vers HTTPS
#   - Port 443 : HTTPS avec TLS 1.2/1.3
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP - Content Security Policy
    # Protège contre les injections XSS même en réseau local
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Uploads API (import de backups chiffrés d'apps, etc.) — défaut nginx 1M sinon
    client_max_body_size 50M;

    # Proxy API vers le backend
    location /api/ {
        proxy_pass http://hub-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Support SSE (Server-Sent Events)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }
    
    # Endpoint SSE spécifique avec timeout long
    location /api/events/stream {
        proxy_pass http://hub-api:8000/api/events/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;  # 24h pour maintenir la connexion SSE
        proxy_send_timeout 86400s;
    }

    # HTML app shell - jamais en cache pour éviter de servir une ancienne UI
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Assets hashés futurs uniquement: cache long autorisé si le nom contient un hash
    location ~* "^/(css|js|img|images|assets)/.+\.[0-9a-f]{8,}\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA routing
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Assets locaux à noms fixes - ne jamais les pinner côté navigateur
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # JavaScript à noms fixes - forcer le rechargement après déploiement
    location ~* \.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
