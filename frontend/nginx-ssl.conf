# HTTPS actif : tout le service est servi en :443 ; :80 ne fait que
# rediriger (301) vers https://$host:${HTTPS_PORT} — les appels machine
# (apps, MCP, scripts) passent par l'API :8000 en interne ou par :443.
# PhiliaNG → inclus conditionnellement via nginx-philia-ng.conf

# =============================================================================
# Port 80 — redirection HTTP → HTTPS
# =============================================================================

server {
    listen 80 default_server;
    server_name _;
    # HUB_HTTPS_PORT substitué par docker-entrypoint.sh (le port PUBLIÉ peut
    # différer du 443 interne — cf. docker-compose.yml "${HUB_HTTPS_PORT}:443").
    return 301 https://$host:${HTTPS_PORT}$request_uri;
}

# =============================================================================
# Port 443 — Hub (catch-all)
# =============================================================================
server {
    listen 443 ssl default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/server/hub/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server/hub/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Headers de sécurité — snippet factorisé (voir security-headers.conf).
    # IMPORTANT : l'include est répété dans chaque location qui redéfinit
    # add_header (Cache-Control...), car une location définissant le moindre
    # add_header perd l'héritage nginx des add_header du bloc server.
    include /etc/nginx/templates/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Uploads API (import de backups chiffrés d'apps, etc.) — défaut nginx 1M sinon
    client_max_body_size 1G;

    # Routes d'inscription : réseau interne uniquement (port 8000 en direct).
    # Jamais par l'entrée publique — la garde par adresse du Hub y voit nginx.
    location ^~ /api/apps/register        { return 403; }
    location ^~ /api/apps/allocate-ports  { return 403; }
    location ^~ /api/apps/me/credentials  { return 403; }
    location ^~ /api/apps/me/shared       { return 403; }
    location ^~ /api/apps/me/openapi      { return 403; }

    location ^~ /api/ {
        proxy_pass http://hub-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Entry public;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # Réécrit les redirections (ex: trailing slash FastAPI) de http:// vers https://
        proxy_redirect http:// $scheme://;
    }

    location /api/events/stream {
        proxy_pass http://hub-api:8000/api/events/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /index.html {
        # add_header local ⇒ héritage des headers du server perdu → include
        include /etc/nginx/templates/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ~* "^/(css|js|img|images|assets)/.+\.[0-9a-f]{8,}\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$" {
        include /etc/nginx/templates/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        include /etc/nginx/templates/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Assets à noms fixes versionnés par ?v= (bumpé par sync_version.py à chaque
    # release) — cache long sûr ; sans `always` pour ne pas cache-stampé les 404
    location ~* \.(css|js)$ {
        include /etc/nginx/templates/security-headers.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }
}
