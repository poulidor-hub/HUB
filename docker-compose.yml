services:
  # ===== BASE DE DONNÉES PostgreSQL =====
  db:
    image: postgres:16-alpine
    container_name: hub-db
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:-hubadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env (généré par install.sh)}
      POSTGRES_DB: ${POSTGRES_DB:-hub_auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - 5432
    networks:
      - hub-network
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # postgres démarre en root puis bascule sur l'utilisateur postgres (chown du datadir)
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hubadmin} -d ${POSTGRES_DB:-hub_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== HUB API (FastAPI) =====
  hub-api:
    build:
      # NB : pas de `network: host` ici — compose v5/buildx 0.38 exige
      # l'entitlement network.host qu'il ne transmet plus ("additional
      # privileges requested").
      context: ./hub
      args:
        # UID de l'utilisateur hôte pour accéder aux fichiers montés (certs/ca/ca.key)
        # Définir HOST_UID=$(id -u) dans .env ou exporter avant docker compose up
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: hub-api
    restart: unless-stopped
    ports:
      - "${HUB_API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-hubadmin}:${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-hub_auth}
      - JWT_ALGORITHM=RS256
      - APP_ENV=${APP_ENV:-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?Définir ADMIN_USERNAME dans .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Définir ADMIN_PASSWORD dans .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@local.lan}
      - HUB_HOST=${HUB_HOST:-}
      - HUB_API_PORT=${HUB_API_PORT:-8000}
      - HUB_FRONTEND_PORT=${HUB_FRONTEND_PORT:-80}
      - APP_PORT_API_START=${APP_PORT_API_START:-9000}
      - APP_PORT_API_END=${APP_PORT_API_END:-9499}
      - APP_PORT_FRONTEND_START=${APP_PORT_FRONTEND_START:-4200}
      - APP_PORT_FRONTEND_END=${APP_PORT_FRONTEND_END:-4699}
      - APP_SUBNET_POOL=${APP_SUBNET_POOL:-10.50.0.0/16}
      - APP_SUBNET_SIZE=${APP_SUBNET_SIZE:-24}
      - PORT_SCAN_DOCKER_ENABLED=${PORT_SCAN_DOCKER_ENABLED:-true}
      - APPS_HOST_PATH=${APPS_HOST_PATH:?Définir APPS_HOST_PATH dans .env (écrit par install.sh, chemin réel de APPS/)}
      - AUTO_GENERATE_KEYS=${AUTO_GENERATE_KEYS:-false}
      - APP_WHITELIST_NETWORKS=${APP_WHITELIST_NETWORKS:-}
      - AUDIT_SSE_COOLDOWN=${AUDIT_SSE_COOLDOWN:-5.0}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-90}
      - ERROR_RETENTION_DAYS=${ERROR_RETENTION_DAYS:-30}
      - LOG_PURGE_INTERVAL_HOURS=${LOG_PURGE_INTERVAL_HOURS:-24}
      - DOCKER_SYNC_INTERVAL=${DOCKER_SYNC_INTERVAL:-300}
      - DOCKER_SCAN_ENABLED=${DOCKER_SCAN_ENABLED:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ALLOWED_ORIGIN_REGEX=${ALLOWED_ORIGIN_REGEX:-}
      # Limite de taille du body (protection DoS) — MB. La limite élargie ne
      # concerne que les uploads de sauvegarde/import (cf. .env.example).
      - MAX_BODY_SIZE_MB=${MAX_BODY_SIZE_MB:-10}
      - MAX_UPLOAD_BODY_SIZE_MB=${MAX_UPLOAD_BODY_SIZE_MB:-512}
      - HUB_HTTPS_ENABLED=${HUB_HTTPS_ENABLED:-true}
      - HUB_HTTPS_PORT=${HUB_HTTPS_PORT:-443}
      # Domaine du proxy transparent PhiliaNG (cert auto-généré par pki.py).
      # Doit matcher le server_name de frontend/nginx-philia-ng.conf.
      - PHILIA_NG_DOMAIN=${PHILIA_NG_DOMAIN:-service.example.org}
      - FORCE_REPLACE_APP=${FORCE_REPLACE_APP:-false}
      - LEGACY_COMPAT_ENABLED=${LEGACY_COMPAT_ENABLED:-false}
      - PKI_CA_COMMON_NAME=${PKI_CA_COMMON_NAME:-Hub Local CA}
      - PKI_CA_ORGANIZATION=${PKI_CA_ORGANIZATION:-Hub Internal}
      - PKI_CA_VALIDITY_YEARS=${PKI_CA_VALIDITY_YEARS:-10}
      - PKI_CERT_DOMAINS=${PKI_CERT_DOMAINS:-localhost,hub.local,hub-frontend}
      - PKI_CERT_IPS=${PKI_CERT_IPS:-}
      - PKI_CERT_VALIDITY_DAYS=${PKI_CERT_VALIDITY_DAYS:-365}
      - PKI_KEY_SIZE=${PKI_KEY_SIZE:-4096}
      # Clé de chiffrement Fernet des secrets service accounts
      # Générer avec: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY:?Définir SECRETS_ENCRYPTION_KEY dans .env (générée via Fernet.generate_key())}
      - ALLOW_PLAINTEXT_SECRETS=${ALLOW_PLAINTEXT_SECRETS:-false}
      - SKIP_PASSWORD_CHECK=${SKIP_PASSWORD_CHECK:-false}
      # OIDC Provider (bridge OIDC pour apps externes - v3.13.0)
      - OIDC_ENABLED=${OIDC_ENABLED:-true}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_EMAIL_TEMPLATE=${OIDC_EMAIL_TEMPLATE:-{username}@hub.internal}
      - OIDC_CODE_TTL_SECONDS=${OIDC_CODE_TTL_SECONDS:-30}
      - OIDC_ID_TOKEN_TTL_MINUTES=${OIDC_ID_TOKEN_TTL_MINUTES:-10}
      - OIDC_ACCESS_TOKEN_TTL_MINUTES=${OIDC_ACCESS_TOKEN_TTL_MINUTES:-15}
      - OIDC_REFRESH_TOKEN_DAYS=${OIDC_REFRESH_TOKEN_DAYS:-30}
      - OIDC_BACKCHANNEL_LOGOUT_ENABLED=${OIDC_BACKCHANNEL_LOGOUT_ENABLED:-true}
      # SLO poste partagé (v3.26.0) — False par défaut, activer via .env après e2e atelier
      - OIDC_SLO_ENABLED=${OIDC_SLO_ENABLED:-false}
      - OIDC_SLO_IFRAME_TIMEOUT_MS=${OIDC_SLO_IFRAME_TIMEOUT_MS:-1500}
      - HUB_INTERNAL_SA_CLIENT_ID=${HUB_INTERNAL_SA_CLIENT_ID:-}
      - HUB_INTERNAL_SA_CLIENT_SECRET=${HUB_INTERNAL_SA_CLIENT_SECRET:-}
    volumes:
      # Secrets et clés JWT
      - ./secrets:/code/secrets:rw
      - ./secrets/service_accounts:/code/secrets/service_accounts:rw
      # Version centralisée (source unique de vérité)
      - ./VERSION:/code/VERSION:ro
      # Documentation d'intégration (accessible via /api/docs/integration)
      - ./INTEGRATION.md:/code/INTEGRATION.md:ro
      # Changelog pour agents IA (accessible via /api/docs/changelog)
      - ./CHANGELOG.md:/code/CHANGELOG.md:ro
      # Stockage des sauvegardes d'applications
      - ./storage/backups:/code/storage/backups:rw
      # Stockage local des snapshots
      - ./storage/snapshots:/code/storage/snapshots:rw
      # Code source des apps (PRA : capture + restauration automatique apps_code.tar)
      - ../APPS:/code/apps_source:rw
      # Déploiement auto : APPS/ monté au MÊME chemin que sur l'hôte —
      # les bind mounts relatifs des compose des apps sont résolus par le
      # daemon hôte, les chemins conteneur/hôte doivent coïncider.
      # APPS_HOST_PATH est obligatoire (aucun défaut : chemin propre à chaque
      # installation, écrit par install.sh).
      - ${APPS_HOST_PATH:?Définir APPS_HOST_PATH dans .env}:${APPS_HOST_PATH:?Définir APPS_HOST_PATH dans .env}:rw
      # Certificats PKI (CA + cert serveur), partagés avec le frontend
      - ./certs:/code/certs:rw
      # Configuration VPN WireGuard (volume partagé avec wireguard-server)
      - vpn-config:/vpn:rw
      # Socket Docker pour le pilotage des conteneurs (docker_scanner)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hub-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 5
    mem_limit: 2g
    memswap_limit: 2g
    # Accès au socket Docker (requis par docker_scanner pour restart/logs/start/stop)
    group_add:
      # GID du groupe docker sur l'hôte — détecté par hubctl init (getent group docker).
      # Fallback 128 (Linux Mint default) pour les installs manuelles sans .env.
      - "${HOST_DOCKER_GID:-128}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # entrypoint.sh tourne en root (chown secrets/certs) puis exec gosu appuser
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ===== FRONTEND (Nginx) =====
  hub-frontend:
    build:
      # Pas de `network: host` (voir hub-api : entitlement buildx 0.38).
      context: ./frontend
    container_name: hub-frontend
    restart: unless-stopped
    ports:
      - "${HUB_FRONTEND_PORT:-80}:80"
      - "${HUB_HTTPS_PORT:-443}:443"
    environment:
      - HUB_HTTPS_ENABLED=${HUB_HTTPS_ENABLED:-true}
      # Port publié du HTTPS (docker-entrypoint.sh : URL de redirection du
      # bloc 80 — nginx interne écoute 443, le mapping peut différer).
      - HUB_HTTPS_PORT=${HUB_HTTPS_PORT:-443}
    volumes:
      - ./certs:/etc/nginx/ssl:ro
    # Permet au conteneur nginx de joindre l'hôte Docker (pour le SNI PhiliaNG
    # qui proxy_pass vers host.docker.internal:4443 — port HTTPS de Philia Proxy).
    # Indépendant de l'IP du serveur : fonctionne sur n'importe quel déploiement.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "${HOST_GID:-1000}"
    depends_on:
      hub-api:
        condition: service_healthy
    networks:
      - hub-network
    mem_limit: 256m
    memswap_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Le seul privilège requis est le bind des ports 80/443.
      - NET_BIND_SERVICE

  # ===== VPN WireGuard Server =====
  # Le HUB est serveur : les utilisateurs s'y connectent à distance.
  # Port 51820/udp doit être ouvert dans le firewall hôte.
  wireguard-server:
    image: linuxserver/wireguard:latest
    container_name: hub-wireguard
    network_mode: host
    profiles:
      - wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - vpn-config:/config
    # Cycle de vie géré par hubctl vpn + boot hook (côté POULIDOR).
    restart: "no"

# ===== VOLUMES =====
volumes:
  postgres_data:
    driver: local
  vpn-config:
    driver: local

# ===== RÉSEAUX =====
networks:
  hub-network:
    driver: bridge
    ipam:
      config:
        # Sous-réseau fixe du Hub (hors plage 172.16-31.x — réservée aux apps).
        # Doit correspondre à la première entrée de APP_WHITELIST_NETWORKS dans .env.
        - subnet: 10.42.0.0/16
