services:
  # ===== BASE DE DONNÉES PostgreSQL =====
  db:
    image: postgres:16-alpine
    container_name: hub-db
    restart: unless-stopped
    # Profil mémoire sûr pour le budget de 1 Go (mem_limit ci-dessous) :
    # shared_buffers ≈ 25 % du budget, effective_cache_size = budget total
    # (buffers + cache page OS), work_mem modéré car le pool applicatif peut
    # ouvrir jusqu'à 50 connexions (cf. hub/app/database.py), maintenance_work_mem
    # pour vacuum/reindex. pg_stat_statements préchargé pour l'observabilité SQL
    # (créer l'extension une fois : `make db-pgss-enable`).
    command: postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c work_mem=8MB -c maintenance_work_mem=128MB -c shared_preload_libraries=pg_stat_statements
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:-hubadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env (généré par install.sh)}
      POSTGRES_DB: ${POSTGRES_DB:-hub_auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - 5432
    networks:
      - hub-network
    mem_limit: 1g
    memswap_limit: 1g
    # Mémoire partagée System V : le défaut Docker (64 Mo) bride les buffers
    # internes de PostgreSQL (work_mem large, parallélisme) côté kernel.
    shm_size: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # postgres démarre en root puis bascule sur l'utilisateur postgres (chown du datadir)
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hubadmin} -d ${POSTGRES_DB:-hub_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== PROXY SOCKET DOCKER (chantier A 1a — durcissement) =====
  # SEUL conteneur autorisé à monter /var/run/docker.sock. hub-api passe par
  # DOCKER_HOST=tcp://docker-socket-proxy:2375. Whitelist = audit des appels
  # réels du 02/11/2026 (cf. docs/DOCKER_SOCKET_PROXY.md) :
  #   scan/inspect/logs/stats → CONTAINERS ; restart/stop → ALLOW_RESTARTS/ALLOW_STOP ;
  #   start → ALLOW_START ; wg show (VPN) + make exec → EXEC ; sous-réseaux → NETWORKS ;
  #   make build (buildx) → BUILD+SESSION+GRPC ; pull/cache → IMAGES ;
  #   info/version → INFO/SYSTEM ; recréation up/down -v → POST (gouverne aussi DELETE).
  # Familles fermées (aucun usage) : AUTH COMMIT CONFIGS DISTRIBUTION NODES PLUGINS
  #   SECRETS SERVICES SWARM TASKS ALLOW_PAUSE ALLOW_UNPAUSE.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: hub-docker-socket-proxy
    restart: unless-stopped
    environment:
      - POST=1
      - CONTAINERS=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      - EXEC=1
      - IMAGES=1
      - BUILD=1
      - SESSION=1
      - GRPC=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
      - SYSTEM=1
      - VERSION=1
      - PING=1
      - EVENTS=1
      # Tout le reste est fermé par défaut du proxy (cf. bloc commentaire ci-dessus).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - hub-network
    mem_limit: 128m
    memswap_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2375/_ping | grep -q OK"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # ===== RÉSOLVEUR DNS (chantier B — routage par noms) =====
  # Autoritaire sur <hub_dns_zone> (fichier hub.zone généré par hub-api) ;
  # forward le reste au résolveur hôte. network_mode host: répond aux clients
  # du tunnel WireGuard (partage le netns du serveur WG) et, plus tard, au LAN.
  # Port 53 non publié (host network) — jamais exposé au-delà du serveur.
  hub-dns:
    # dnsmasq 2.90 (Alpine 3.20) — build local, cf. hub-dns/Dockerfile
    build:
      context: ./hub-dns
    container_name: hub-dns
    restart: unless-stopped
    volumes:
      - ./dns:/etc/dnsmasq.d:ro
      - ./dns-generated:/etc/dnsmasq.d-generated:ro
    network_mode: host
    mem_limit: 64m
    memswap_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # port 53 (<1024)
    healthcheck:
      test: ["CMD-SHELL", "pgrep dnsmasq >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ===== HUB API (FastAPI) =====
  hub-api:
    build:
      # NB : pas de `network: host` ici — compose v5/buildx 0.38 exige
      # l'entitlement network.host qu'il ne transmet plus ("additional
      # privileges requested").
      context: ./hub
      args:
        # UID de l'utilisateur hôte pour accéder aux fichiers montés (certs/ca/ca.key)
        # Définir HOST_UID=$(id -u) dans .env ou exporter avant docker compose up
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: hub-api
    restart: unless-stopped
    ports:
      - "${HUB_API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-hubadmin}:${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-hub_auth}
      - JWT_ALGORITHM=RS256
      - APP_ENV=${APP_ENV:-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?Définir ADMIN_USERNAME dans .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Définir ADMIN_PASSWORD dans .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@local.lan}
      - HUB_HOST=${HUB_HOST:-}
      - HUB_API_PORT=${HUB_API_PORT:-8000}
      - HUB_FRONTEND_PORT=${HUB_FRONTEND_PORT:-80}
      - APP_PORT_API_START=${APP_PORT_API_START:-9000}
      - APP_PORT_API_END=${APP_PORT_API_END:-9499}
      - APP_PORT_FRONTEND_START=${APP_PORT_FRONTEND_START:-4200}
      - APP_PORT_FRONTEND_END=${APP_PORT_FRONTEND_END:-4699}
      - APP_SUBNET_POOL=${APP_SUBNET_POOL:-10.50.0.0/16}
      - APP_SUBNET_SIZE=${APP_SUBNET_SIZE:-24}
      - PORT_SCAN_DOCKER_ENABLED=${PORT_SCAN_DOCKER_ENABLED:-true}
      - APPS_HOST_PATH=${APPS_HOST_PATH:?Définir APPS_HOST_PATH dans .env (écrit par install.sh, chemin réel de APPS/)}
      - AUTO_GENERATE_KEYS=${AUTO_GENERATE_KEYS:-false}
      - APP_WHITELIST_NETWORKS=${APP_WHITELIST_NETWORKS:-}
      - AUDIT_SSE_COOLDOWN=${AUDIT_SSE_COOLDOWN:-5.0}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-90}
      - ERROR_RETENTION_DAYS=${ERROR_RETENTION_DAYS:-30}
      - LOG_PURGE_INTERVAL_HOURS=${LOG_PURGE_INTERVAL_HOURS:-24}
      - DOCKER_SYNC_INTERVAL=${DOCKER_SYNC_INTERVAL:-300}
      - DOCKER_SCAN_ENABLED=${DOCKER_SCAN_ENABLED:-false}
      # Accès Docker via le proxy filtré (chantier A 1a) — plus aucun montage
      # socket direct sur ce conteneur. Voir docs/DOCKER_SOCKET_PROXY.md.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ALLOWED_ORIGIN_REGEX=${ALLOWED_ORIGIN_REGEX:-}
      # Limite de taille du body (protection DoS) — MB. La limite élargie ne
      # concerne que les uploads de sauvegarde/import (cf. .env.example).
      - MAX_BODY_SIZE_MB=${MAX_BODY_SIZE_MB:-10}
      - MAX_UPLOAD_BODY_SIZE_MB=${MAX_UPLOAD_BODY_SIZE_MB:-512}
      - HUB_HTTPS_ENABLED=${HUB_HTTPS_ENABLED:-true}
      - HUB_HTTPS_PORT=${HUB_HTTPS_PORT:-443}
      # Domaine du proxy transparent PhiliaNG : pilote le certificat auto-généré
      # par pki.py ET le server_name du vhost (même variable passée à
      # hub-frontend, qui la rend au démarrage depuis nginx-philia-ng.conf).
      - PHILIA_NG_DOMAIN=${PHILIA_NG_DOMAIN:-proxy.example.lan}
      - FORCE_REPLACE_APP=${FORCE_REPLACE_APP:-false}
      - LEGACY_COMPAT_ENABLED=${LEGACY_COMPAT_ENABLED:-false}
      - PKI_CA_COMMON_NAME=${PKI_CA_COMMON_NAME:-Hub Local CA}
      - PKI_CA_ORGANIZATION=${PKI_CA_ORGANIZATION:-Hub Internal}
      - PKI_CA_VALIDITY_YEARS=${PKI_CA_VALIDITY_YEARS:-10}
      - PKI_CERT_DOMAINS=${PKI_CERT_DOMAINS:-localhost,hub.local,hub-frontend}
      - PKI_CERT_IPS=${PKI_CERT_IPS:-}
      - PKI_CERT_VALIDITY_DAYS=${PKI_CERT_VALIDITY_DAYS:-365}
      - PKI_KEY_SIZE=${PKI_KEY_SIZE:-4096}
      # Clé de chiffrement Fernet des secrets service accounts
      # Générer avec: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY:?Définir SECRETS_ENCRYPTION_KEY dans .env (générée via Fernet.generate_key())}
      - ALLOW_PLAINTEXT_SECRETS=${ALLOW_PLAINTEXT_SECRETS:-false}
      - SKIP_PASSWORD_CHECK=${SKIP_PASSWORD_CHECK:-false}
      # OIDC Provider (bridge OIDC pour apps externes - v3.13.0)
      - OIDC_ENABLED=${OIDC_ENABLED:-true}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_EMAIL_TEMPLATE=${OIDC_EMAIL_TEMPLATE:-{username}@hub.internal}
      - OIDC_CODE_TTL_SECONDS=${OIDC_CODE_TTL_SECONDS:-30}
      - OIDC_ID_TOKEN_TTL_MINUTES=${OIDC_ID_TOKEN_TTL_MINUTES:-10}
      - OIDC_ACCESS_TOKEN_TTL_MINUTES=${OIDC_ACCESS_TOKEN_TTL_MINUTES:-15}
      - OIDC_REFRESH_TOKEN_DAYS=${OIDC_REFRESH_TOKEN_DAYS:-30}
      - OIDC_BACKCHANNEL_LOGOUT_ENABLED=${OIDC_BACKCHANNEL_LOGOUT_ENABLED:-true}
      # SLO poste partagé (v3.26.0) — False par défaut, activer via .env après e2e atelier
      - OIDC_SLO_ENABLED=${OIDC_SLO_ENABLED:-false}
      - OIDC_SLO_IFRAME_TIMEOUT_MS=${OIDC_SLO_IFRAME_TIMEOUT_MS:-1500}
      - HUB_INTERNAL_SA_CLIENT_ID=${HUB_INTERNAL_SA_CLIENT_ID:-}
      - HUB_INTERNAL_SA_CLIENT_SECRET=${HUB_INTERNAL_SA_CLIENT_SECRET:-}
    volumes:
      # Secrets et clés JWT
      - ./secrets:/code/secrets:rw
      - ./secrets/service_accounts:/code/secrets/service_accounts:rw
      # Version centralisée (source unique de vérité)
      - ./VERSION:/code/VERSION:ro
      # Documentation d'intégration (accessible via /api/docs/integration)
      - ./INTEGRATION.md:/code/INTEGRATION.md:ro
      # Changelog pour agents IA (accessible via /api/docs/changelog)
      - ./CHANGELOG.md:/code/CHANGELOG.md:ro
      # Stockage des sauvegardes d'applications
      - ./storage/backups:/code/storage/backups:rw
      # Stockage local des snapshots
      - ./storage/snapshots:/code/storage/snapshots:rw
      # Code source des apps (PRA : capture + restauration automatique apps_code.tar)
      - ../APPS:/code/apps_source:rw
      # Déploiement auto : APPS/ monté au MÊME chemin que sur l'hôte —
      # les bind mounts relatifs des compose des apps sont résolus par le
      # daemon hôte, les chemins conteneur/hôte doivent coïncider.
      # APPS_HOST_PATH est obligatoire (aucun défaut : chemin propre à chaque
      # installation, écrit par install.sh).
      - ${APPS_HOST_PATH:?Définir APPS_HOST_PATH dans .env}:${APPS_HOST_PATH:?Définir APPS_HOST_PATH dans .env}:rw
      # Certificats PKI (CA + cert serveur), partagés avec le frontend
      - ./certs:/code/certs:rw
      # Routage par noms (chantier B) : zone DNS + vhosts SNI générés par
      # routing_service.publish() — hub-dns et hub-frontend les lisent en ro.
      - ./dns-generated:/code/dns-generated:rw
      - ./gateway:/code/gateway:rw
      # Configuration VPN WireGuard (volume partagé avec wireguard-server)
      - vpn-config:/vpn:rw
    depends_on:
      db:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
    networks:
      - hub-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 5
    mem_limit: 2g
    memswap_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # NB : plus de GID docker hôte monté sur ce service — l'accès Docker passe
    # par le proxy filtré (tcp://docker-socket-proxy:2375), plus aucun socket monté.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # entrypoint.sh tourne en root (chown secrets/certs) puis exec gosu appuser
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ===== FRONTEND (Nginx) =====
  hub-frontend:
    build:
      # Pas de `network: host` (voir hub-api : entitlement buildx 0.38).
      context: ./frontend
    container_name: hub-frontend
    restart: unless-stopped
    ports:
      - "${HUB_FRONTEND_PORT:-80}:80"
      - "${HUB_HTTPS_PORT:-443}:443"
    environment:
      - HUB_HTTPS_ENABLED=${HUB_HTTPS_ENABLED:-true}
      # Port publié du HTTPS (docker-entrypoint.sh : URL de redirection du
      # bloc 80 — nginx interne écoute 443, le mapping peut différer).
      - HUB_HTTPS_PORT=${HUB_HTTPS_PORT:-443}
      # Domaine du vhost PhiliaNG : docker-entrypoint.sh le substitue au jeton
      # __PHILIA_NG_DOMAIN__ de nginx-philia-ng.conf au démarrage. Même
      # expression que hub-api : le certificat est émis pour ce nom.
      - PHILIA_NG_DOMAIN=${PHILIA_NG_DOMAIN:-proxy.example.lan}
    volumes:
      - ./certs:/etc/nginx/ssl:ro
      # Vhosts SNI générés par hub-api (chantier B — routage par noms)
      - ./gateway:/etc/nginx/vhosts.d:ro
    # Permet au conteneur nginx de joindre l'hôte Docker (pour le SNI PhiliaNG
    # qui proxy_pass vers host.docker.internal:4443 — port HTTPS de Philia Proxy).
    # Indépendant de l'IP du serveur : fonctionne sur n'importe quel déploiement.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "${HOST_GID:-1000}"
    depends_on:
      hub-api:
        condition: service_healthy
    networks:
      - hub-network
    mem_limit: 256m
    memswap_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Le seul privilège requis est le bind des ports 80/443.
      - NET_BIND_SERVICE

  # ===== VPN WireGuard Server =====
  # Le HUB est serveur : les utilisateurs s'y connectent à distance.
  # Port 51821/udp doit être ouvert dans le firewall hôte (vpn_listen_port
  # en DB app_settings — 51820 est l'exemple de la doc linuxserver).
  wireguard-server:
    image: linuxserver/wireguard:latest
    container_name: hub-wireguard
    network_mode: host
    profiles:
      - wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - vpn-config:/config
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # Cycle de vie : `hubctl vpn` pilote démarrage/arrêt (vpn_enabled en DB).
    # unless-stopped honore un `docker stop` explicite (hubctl vpn down) tout
    # en faisant repasser le tunnel après un restart du daemon docker ou un
    # reboot de l'hôte — incident du 13/11/2026 : policy "no" + daemon
    # restarté = tunnel mort 30 h (le boot hook systemd ne couvre que les
    # boots, pas les restarts du daemon).
    restart: unless-stopped

# ===== VOLUMES =====
volumes:
  postgres_data:
    driver: local
  vpn-config:
    driver: local

# ===== RÉSEAUX =====
networks:
  hub-network:
    driver: bridge
    ipam:
      config:
        # Sous-réseau fixe du Hub (hors plage 172.16-31.x — réservée aux apps).
        # Doit correspondre à la première entrée de APP_WHITELIST_NETWORKS dans .env.
        - subnet: 10.42.0.0/16
