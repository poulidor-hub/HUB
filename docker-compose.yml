services:
  # ===== BASE DE DONNÉES PostgreSQL =====
  db:
    image: postgres:16-alpine
    container_name: hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hubadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub_secure_password_2025}
      POSTGRES_DB: ${POSTGRES_DB:-hub_auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - 5432
    networks:
      - hub-network
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hubadmin} -d ${POSTGRES_DB:-hub_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== HUB API (FastAPI) =====
  hub-api:
    build:
      context: ./hub
      network: host
      args:
        # UID de l'utilisateur hôte pour accéder aux fichiers montés (certs/ca/ca.key)
        # Définir HOST_UID=$(id -u) dans .env ou exporter avant docker compose up
        HOST_UID: ${HOST_UID:-1000}
    container_name: hub-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-hubadmin}:${POSTGRES_PASSWORD:-hub_secure_password_2025}@db:5432/${POSTGRES_DB:-hub_auth}
      - JWT_ALGORITHM=RS256
      - APP_ENV=${APP_ENV:-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?Définir ADMIN_USERNAME dans .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Définir ADMIN_PASSWORD dans .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@local.lan}
      - HUB_HOST=${HUB_HOST:-}
      - AUTO_GENERATE_KEYS=${AUTO_GENERATE_KEYS:-false}
      - APP_WHITELIST_NETWORKS=${APP_WHITELIST_NETWORKS:-}
      - AUDIT_SSE_COOLDOWN=${AUDIT_SSE_COOLDOWN:-5.0}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-90}
      - ERROR_RETENTION_DAYS=${ERROR_RETENTION_DAYS:-30}
      - LOG_PURGE_INTERVAL_HOURS=${LOG_PURGE_INTERVAL_HOURS:-24}
      - DOCKER_SYNC_INTERVAL=${DOCKER_SYNC_INTERVAL:-300}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - HUB_HTTPS_ENABLED=${HUB_HTTPS_ENABLED:-true}
      - HUB_HTTPS_PORT=${HUB_HTTPS_PORT:-443}
      - PKI_CA_COMMON_NAME=${PKI_CA_COMMON_NAME:-Hub Local CA}
      - PKI_CA_ORGANIZATION=${PKI_CA_ORGANIZATION:-Hub Internal}
      - PKI_CA_VALIDITY_YEARS=${PKI_CA_VALIDITY_YEARS:-10}
      - PKI_CERT_DOMAINS=${PKI_CERT_DOMAINS:-localhost,hub.local,hub-frontend}
      - PKI_CERT_IPS=${PKI_CERT_IPS:-}
      - PKI_CERT_VALIDITY_DAYS=${PKI_CERT_VALIDITY_DAYS:-365}
      - PKI_KEY_SIZE=${PKI_KEY_SIZE:-4096}
      # Clé de chiffrement Fernet des secrets service accounts
      # Générer avec: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY:?Définir SECRETS_ENCRYPTION_KEY dans .env (générée via Fernet.generate_key())}
    volumes:
      # Secrets et clés JWT
      - ./secrets:/code/secrets:rw
      - ./secrets/service_accounts:/code/secrets/service_accounts:rw
      # Version centralisée (source unique de vérité)
      - ./VERSION:/code/VERSION:ro
      # Documentation d'intégration (accessible via /api/docs/integration)
      - ./INTEGRATION.md:/code/INTEGRATION.md:ro
      # Changelog pour agents IA (accessible via /api/docs/changelog)
      - ./CHANGELOG.md:/code/CHANGELOG.md:ro
      # Socket Docker pour la détection automatique des conteneurs (lecture seule)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Stockage des sauvegardes d'applications
      - ./storage/backups:/code/storage/backups:rw
      # Stockage local des snapshots
      - ./storage/snapshots:/code/storage/snapshots:rw
      # Certificats PKI (CA + cert serveur), partagés avec le frontend
      - ./certs:/code/certs:rw
    # Groupe docker pour accéder au socket
    # ⚠️ Le GID varie selon les systèmes : 986 (Arch), 999 (Debian), 998, etc.
    # Vérifiez avec: getent group docker
    # Définissez DOCKER_GID dans .env ou utilisez: DOCKER_GID=$(getent group docker | cut -d: -f3)
    group_add:
      - "${DOCKER_GID:-986}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hub-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 5
    mem_limit: 2g
    memswap_limit: 2g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s

  # ===== FRONTEND (Nginx) =====
  hub-frontend:
    build:
      context: ./frontend
      network: host
    container_name: hub-frontend
    restart: unless-stopped
    ports:
      - "${HUB_FRONTEND_PORT:-80}:80"
      - "${HUB_HTTPS_PORT:-443}:443"
    environment:
      - HUB_HTTPS_ENABLED=${HUB_HTTPS_ENABLED:-true}
    volumes:
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      hub-api:
        condition: service_healthy
    networks:
      - hub-network
    mem_limit: 256m
    memswap_limit: 256m
    security_opt:
      - no-new-privileges:true

# ===== VOLUMES =====
volumes:
  postgres_data:
    driver: local

# ===== RÉSEAUX =====
networks:
  hub-network:
    driver: bridge
