# ============================================================
# Override Compose pour tests isolés
# Usage :
#   docker compose -p pouly-test \
#     -f docker-compose.yml -f docker-compose.test.yml up -d
#
# Isole un Hub de test sans toucher au Hub de production :
#   - conteneurs renommés (hub-test-*)
#   - aucune publication de ports hôte (ports: !override [])
#   - sous-réseau Docker distinct
# ============================================================

services:
  db:
    container_name: hub-test-db

  hub-api:
    container_name: hub-test-api
    ports: !override []

  hub-frontend:
    container_name: hub-test-frontend
    ports: !override []

networks:
  hub-network:
    ipam:
      config:
        - subnet: 10.99.0.0/16
