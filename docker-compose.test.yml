# ============================================================
# Override Compose pour tests isolés
# Usage :
#   docker compose -p pouly-test \
#     -f docker-compose.yml -f docker-compose.test.yml up -d
#
# Isole un Hub de test sans toucher au Hub de production :
#   - conteneurs renommés (hub-test-*)
#   - aucune publication de ports hôte (ports: !override [])
#   - sous-réseau Docker distinct
# ============================================================

services:
  db:
    container_name: hub-test-db
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  docker-socket-proxy:
    # Renommé comme db/api/frontend : container_name est global (non namespacé
    # par -p) — sans override, la pile de test entre en conflit avec le
    # conteneur hub-docker-socket-proxy du Hub en production.
    container_name: hub-test-docker-socket-proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  hub-api:
    container_name: hub-test-api
    ports: !override []
    # Indépendance du .env hôte (prod) : APPS_HOST_PATH y pointe vers le vrai
    # chemin APPS/ (ex. /home/<user>/...) et polluait les tests qui valident
    # la configuration (test_apps_host_path_setting_default et voisins —
    # non-régression 3.71.x). Valeur forcée au défaut canonique de config.py ;
    # le défaut AUTHENTIQUE reste couvert par la suite hôte (pas de .env).
    # NB : le reset par clé (`APPS_HOST_PATH: !reset null`) est ignoré par
    # compose v5 — on surcharge explicitement.
    # (Le `build: !override` qui contournait l'entitlement buildx network.host
    # est retiré : docker-compose.yml ne déclare plus network:host.)
    environment:
      APPS_HOST_PATH: /data/apps

  hub-frontend:
    container_name: hub-test-frontend
    ports: !override []

networks:
  hub-network:
    ipam:
      config:
        - subnet: 10.99.0.0/16
