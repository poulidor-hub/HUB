# Généré par le HUB — ajoute les healthchecks manquants
# Chargé automatiquement par 'docker compose' quand présent.
# Voir health_checker.py pour le mécanisme de vérification.

services:
  hub-frontend:
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
