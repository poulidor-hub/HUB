# =============================================================================
# Docker Compose — Développement uniquement (overlay explicite)
# =============================================================================
# Ce fichier n'est PAS chargé automatiquement. Pour le développement :
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   (ou: make up-dev)
# En production, n'utilisez QUE le fichier de base :
#   docker compose -f docker-compose.yml up -d   (ou: make up-prod)
# =============================================================================

services:
  db:
    # En développement, évite les dumps SQL très longs quand une requête est
    # annulée par un reload/arrêt côté client.
    command: postgres -c log_min_error_statement=fatal

  hub-api:
    # Hot-reload pour le développement
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 5
    volumes:
      # Montage du code source pour hot-reload
      - ./hub/app:/code/app
      - ./hub/tests:/code/tests
      - ./hub/migrations:/code/migrations
      - ./hub/app_tester.py:/code/app_tester.py
      - ./hub/pytest.ini:/code/pytest.ini
