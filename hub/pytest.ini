[pytest]
asyncio_mode = auto
# Scope explicite exigé par pytest-asyncio ≥ 1.4.1 (sinon PytestDeprecationWarning
# — fatale ici via filterwarnings=error::DeprecationWarning ; INTERNALERROR au
# rebuild de l'image ayant pris pytest 9.2.0).
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
filterwarnings =
    error::DeprecationWarning
    ignore:'crypt' is deprecated:DeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

[coverage:run]
source = app
omit = 
    app/__init__.py
    tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
